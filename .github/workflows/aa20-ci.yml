name: AA-20 CI gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_browser:
        description: Run the asset-backed browser release tier (configured self-hosted runner required)
        type: boolean
        default: false

jobs:
  contracts:
    name: Build and Gosper contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.48.2
          cache: true
      - run: pixi install --locked
      - run: pixi run bash scripts/ci_contracts.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aa20-contract-reports
          path: artifacts/ci
          if-no-files-found: warn

  release-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.release_browser
    name: Asset-backed browser release tier
    runs-on: [self-hosted, hexagons-assets, chromium]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: prefix-dev/setup-pixi@v0.9.1
      - run: pixi install --locked
      - run: pixi run pip install websockets
      - run: pixi run bash scripts/release_browser_gates.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aa20-release-browser-reports
          path: artifacts/release-browser
