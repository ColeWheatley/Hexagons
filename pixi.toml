# Hexagons – hexagonal terrain tile baker for the Powfinder ski area explorer
# Deps: rasterio, shapely, pyproj, pillow, numpy (all native ARM64 on conda-forge)
[workspace]
name = "hexagons"
version = "0.1.0"
description = "Hexagons – hexagonal terrain tile baker and aerial imagery pipeline"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
numpy = "*"
rasterio = "*"
shapely = "*"
pyproj = "*"
pillow = "*"
scipy = "*"
psutil = "*"
awscli = "*"
tqdm = "*"
requests = "*"
ipykernel = "*"
jax = ">=0.10.2,<0.11"
pytest = ">=9.1.1,<10"

[tasks]
bake      = "python hex_backend/waffle_iron.py"
bake-mini = "python hex_backend/waffle_iron.py --grid 6 --fast-texture-encode"
texture-stack = "python ktx2_nonrect_texture_test/scripts/check_texture_stack.py"
texture-build-basisu-v2 = "bash ktx2_nonrect_texture_test/scripts/build_basisu_v2.sh"
texture-toy-assets = "python ktx2_nonrect_texture_test/scripts/generate_assets.py"
texture-zoom-assets = "python ktx2_nonrect_texture_test/production_zoom/scripts/generate_production_zoom_assets.py"
search-index = "python scripts/generate_search_index.py"
